spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**,/api/auth/**
            - id: parking-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/parkings/**
            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/bookings/**
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
